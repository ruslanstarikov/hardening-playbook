---
# Strict hardening configuration for high-security environments
# Place this file in inventory/group_vars/all.yml or specific group

# SSH - Very strict settings
hardening_ssh_port: 2222
hardening_ssh_permit_root_login: "no"
hardening_ssh_password_authentication: "no"
hardening_ssh_pubkey_authentication: "yes"
hardening_ssh_permit_empty_passwords: "no"
hardening_ssh_x11_forwarding: "no"
hardening_ssh_max_auth_tries: 2
hardening_ssh_client_alive_interval: 300
hardening_ssh_client_alive_count_max: 2
hardening_ssh_login_grace_time: 30
hardening_ssh_allowed_users:
  - admin
  - deploy
hardening_ssh_allowed_groups:
  - admins

# Password policies - Strict
hardening_password_max_days: 60
hardening_password_min_days: 1
hardening_password_warn_age: 7
hardening_password_min_length: 16
hardening_password_remember: 10
hardening_disable_unused_users: true

# Network - Restrictive
hardening_disable_ipv6: true
hardening_disable_wireless: true
hardening_disable_uncommon_protocols: true

# Services - Minimal
hardening_disable_services:
  - avahi-daemon
  - cups
  - isc-dhcp-server
  - isc-dhcp-server6
  - rpcbind
  - rsync
  - snmpd
  - bluetooth
  - iscsid

# Audit and logging - Comprehensive
hardening_enable_auditd: true
hardening_log_suspicious_packets: true

# Kernel hardening - Maximum security
hardening_kernel_parameters:
  - { name: "net.ipv4.ip_forward", value: 0 }
  - { name: "net.ipv4.conf.all.send_redirects", value: 0 }
  - { name: "net.ipv4.conf.default.send_redirects", value: 0 }
  - { name: "net.ipv4.conf.all.accept_source_route", value: 0 }
  - { name: "net.ipv4.conf.default.accept_source_route", value: 0 }
  - { name: "net.ipv4.conf.all.accept_redirects", value: 0 }
  - { name: "net.ipv4.conf.default.accept_redirects", value: 0 }
  - { name: "net.ipv4.conf.all.secure_redirects", value: 0 }
  - { name: "net.ipv4.conf.default.secure_redirects", value: 0 }
  - { name: "net.ipv4.conf.all.log_martians", value: 1 }
  - { name: "net.ipv4.conf.default.log_martians", value: 1 }
  - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: 1 }
  - { name: "net.ipv4.icmp_ignore_bogus_error_responses", value: 1 }
  - { name: "net.ipv4.conf.all.rp_filter", value: 1 }
  - { name: "net.ipv4.conf.default.rp_filter", value: 1 }
  - { name: "net.ipv4.tcp_syncookies", value: 1 }
  - { name: "kernel.randomize_va_space", value: 2 }
  - { name: "kernel.dmesg_restrict", value: 1 }
  - { name: "kernel.kptr_restrict", value: 2 }
  - { name: "fs.suid_dumpable", value: 0 }
  - { name: "kernel.yama.ptrace_scope", value: 2 }
