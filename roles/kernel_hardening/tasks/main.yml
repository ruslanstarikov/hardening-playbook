---
- name: Apply kernel hardening parameters
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  loop: "{{ hardening_kernel_parameters }}"

- name: Enable ASLR (Address Space Layout Randomization)
  sysctl:
    name: kernel.randomize_va_space
    value: '2'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Restrict kernel dmesg access
  sysctl:
    name: kernel.dmesg_restrict
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Hide kernel pointers
  sysctl:
    name: kernel.kptr_restrict
    value: '2'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Restrict kernel module loading
  sysctl:
    name: kernel.modules_disabled
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Restrict ptrace scope
  sysctl:
    name: kernel.yama.ptrace_scope
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  failed_when: false

- name: Disable kexec
  sysctl:
    name: kernel.kexec_load_disabled
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  failed_when: false

- name: Restrict access to kernel logs
  sysctl:
    name: kernel.printk
    value: '3 3 3 3'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Configure kernel panic behavior
  sysctl:
    name: kernel.panic
    value: '10'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Configure kernel panic on oops
  sysctl:
    name: kernel.panic_on_oops
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Disable core dumps
  sysctl:
    name: fs.suid_dumpable
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Set file descriptor limits
  sysctl:
    name: fs.file-max
    value: '65535'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Protect hard links
  sysctl:
    name: fs.protected_hardlinks
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Protect symbolic links
  sysctl:
    name: fs.protected_symlinks
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Configure SELinux (RedHat/CentOS/Amazon Linux)
  selinux:
    policy: targeted
    state: enforcing
  when: 
    - ansible_os_family == "RedHat"
    - ansible_selinux is defined
    - ansible_selinux.status == 'enabled'
  failed_when: false

- name: Install AppArmor (Debian/Ubuntu)
  apt:
    name:
      - apparmor
      - apparmor-utils
    state: present
  when: ansible_os_family == "Debian"

- name: Enable AppArmor (Debian/Ubuntu)
  service:
    name: apparmor
    enabled: yes
    state: started
  when: ansible_os_family == "Debian"

- name: Check if GRUB configuration exists
  stat:
    path: /etc/default/grub
  register: grub_config

- name: Enable IOMMU for better hardware isolation
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="intel_iommu=on amd_iommu=on"'
    state: present
  when: 
    - grub_config.stat.exists
    - ansible_virtualization_role != "guest"
  notify: update grub
  failed_when: false
