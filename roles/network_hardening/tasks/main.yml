---
- name: Install firewall (Debian/Ubuntu)
  apt:
    name: ufw
    state: present
  when: ansible_os_family == "Debian"

- name: Install firewall (RedHat/CentOS/Amazon Linux)
  yum:
    name: firewalld
    state: present
  when: ansible_os_family == "RedHat"

- name: Install firewall (OpenSUSE)
  zypper:
    name: firewalld
    state: present
  when: ansible_os_family == "Suse"

- name: Enable and start firewall (Debian/Ubuntu)
  ufw:
    state: enabled
    policy: deny
  when: ansible_os_family == "Debian"

- name: Allow SSH through firewall (Debian/Ubuntu)
  ufw:
    rule: allow
    port: "{{ hardening_ssh_port }}"
    proto: tcp
  when: ansible_os_family == "Debian"

- name: Enable and start firewall (RedHat/Amazon Linux/OpenSUSE)
  service:
    name: firewalld
    enabled: yes
    state: started
  when: ansible_os_family in ["RedHat", "Suse"]

- name: Allow SSH through firewall (RedHat/Amazon Linux/OpenSUSE)
  firewalld:
    service: ssh
    permanent: yes
    state: enabled
    immediate: yes
  when: ansible_os_family in ["RedHat", "Suse"]

- name: Disable IPv6 if configured
  sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
    - net.ipv6.conf.lo.disable_ipv6
  when: hardening_disable_ipv6 | bool

- name: Disable uncommon network protocols
  lineinfile:
    path: /etc/modprobe.d/uncommon-protocols.conf
    line: "install {{ item }} /bin/true"
    create: yes
    mode: '0644'
  loop:
    - dccp
    - sctp
    - rds
    - tipc
  when: hardening_disable_uncommon_protocols | bool

- name: Disable wireless interfaces if configured
  shell: |
    nmcli radio wifi off
  when: 
    - hardening_disable_wireless | bool
    - ansible_os_family != "Suse"
  failed_when: false
  changed_when: false

- name: Configure TCP SYN cookies
  sysctl:
    name: net.ipv4.tcp_syncookies
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Disable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Disable ICMP redirects
  sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  loop:
    - net.ipv4.conf.all.send_redirects
    - net.ipv4.conf.default.send_redirects
    - net.ipv4.conf.all.accept_redirects
    - net.ipv4.conf.default.accept_redirects
    - net.ipv4.conf.all.secure_redirects
    - net.ipv4.conf.default.secure_redirects

- name: Disable source routing
  sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  loop:
    - net.ipv4.conf.all.accept_source_route
    - net.ipv4.conf.default.accept_source_route

- name: Enable reverse path filtering
  sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  loop:
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter

- name: Enable logging of martian packets
  sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes
  loop:
    - net.ipv4.conf.all.log_martians
    - net.ipv4.conf.default.log_martians

- name: Ignore ICMP broadcast requests
  sysctl:
    name: net.ipv4.icmp_echo_ignore_broadcasts
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Ignore bogus ICMP errors
  sysctl:
    name: net.ipv4.icmp_ignore_bogus_error_responses
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: yes

- name: Configure hosts.allow
  lineinfile:
    path: /etc/hosts.allow
    line: 'sshd: ALL'
    create: yes
    mode: '0644'

- name: Configure hosts.deny
  lineinfile:
    path: /etc/hosts.deny
    line: 'ALL: ALL'
    create: yes
    mode: '0644'
