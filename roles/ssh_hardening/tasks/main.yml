---
- name: Ensure OpenSSH server is installed (Debian/Ubuntu)
  apt:
    name: openssh-server
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure OpenSSH server is installed (RedHat/CentOS/Amazon Linux)
  yum:
    name: openssh-server
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure OpenSSH server is installed (OpenSUSE)
  zypper:
    name: openssh
    state: present
  when: ansible_os_family == "Suse"

- name: Backup original sshd_config
  copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.backup
    remote_src: yes
    force: no

- name: Configure SSH daemon
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  loop:
    - { regexp: '^#?Port', line: 'Port {{ hardening_ssh_port }}' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin {{ hardening_ssh_permit_root_login }}' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication {{ hardening_ssh_password_authentication }}' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication {{ hardening_ssh_pubkey_authentication }}' }
    - { regexp: '^#?PermitEmptyPasswords', line: 'PermitEmptyPasswords {{ hardening_ssh_permit_empty_passwords }}' }
    - { regexp: '^#?X11Forwarding', line: 'X11Forwarding {{ hardening_ssh_x11_forwarding }}' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries {{ hardening_ssh_max_auth_tries }}' }
    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval {{ hardening_ssh_client_alive_interval }}' }
    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax {{ hardening_ssh_client_alive_count_max }}' }
    - { regexp: '^#?LoginGraceTime', line: 'LoginGraceTime {{ hardening_ssh_login_grace_time }}' }
    - { regexp: '^#?Protocol', line: 'Protocol {{ hardening_ssh_protocol }}' }
    - { regexp: '^#?UsePAM', line: 'UsePAM {{ hardening_ssh_use_pam }}' }
    - { regexp: '^#?IgnoreRhosts', line: 'IgnoreRhosts yes' }
    - { regexp: '^#?HostbasedAuthentication', line: 'HostbasedAuthentication no' }
    - { regexp: '^#?PermitUserEnvironment', line: 'PermitUserEnvironment no' }
    - { regexp: '^#?StrictModes', line: 'StrictModes yes' }
    - { regexp: '^#?MaxSessions', line: 'MaxSessions 4' }
    - { regexp: '^#?MaxStartups', line: 'MaxStartups 10:30:60' }
  notify: restart sshd

- name: Configure SSH allowed users
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers'
    line: "AllowUsers {{ hardening_ssh_allowed_users | join(' ') }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  when: hardening_ssh_allowed_users | length > 0
  notify: restart sshd

- name: Configure SSH allowed groups
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowGroups'
    line: "AllowGroups {{ hardening_ssh_allowed_groups | join(' ') }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  when: hardening_ssh_allowed_groups | length > 0
  notify: restart sshd

- name: Set proper permissions on SSH directory
  file:
    path: /etc/ssh
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Set proper permissions on SSH private keys
  shell: |
    chmod 0600 /etc/ssh/ssh_host_*_key
  changed_when: false
  failed_when: false

- name: Set proper permissions on SSH public keys
  shell: |
    chmod 0644 /etc/ssh/ssh_host_*_key.pub
  changed_when: false
  failed_when: false

- name: Ensure SSH service is enabled and running
  service:
    name: "{{ ssh_service_name }}"
    enabled: yes
    state: started
